name: Bookingservice DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      # 4. Setup Java (for Sonar)
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        with:
          args: >
            -Dsonar.projectKey=Norahbiju_bookingservice
            -Dsonar.organization=norahbiju
            -Dsonar.sources=. 
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
 
      # 6. Quality Gate
      - name: Quality Gate Check
        id: sonarqube-quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 7. Snyk Scan
      - name: Snyk Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=src/requirements.txt

      # 8. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/bookingservice:latest .

      # 9. Scan Docker Image 
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/bookingservice:latest
          exit-code: 1
          severity: HIGH,MEDIUM

      # 10. Docker Login
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 11. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/bookingservice:latest

      # ❌ Failure Email (Detailed)
      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Bookingservice Pipeline Failed - Immediate Attention Required"
          body: |
            Hello DevOps Team,

            The Bookingservice CI/CD pipeline execution has failed during the latest run, and immediate attention is required to ensure system reliability, security compliance, and uninterrupted delivery.

            🔍 Failure Context:
            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Workflow: ${{ github.workflow }}
            - Job: ${{ github.job }}
            - Triggered By: ${{ github.actor }}

            ⚠️ Possible Root Causes:
            The failure could have occurred due to one or more of the following reasons:
            - SonarQube Quality Gate failure due to detected vulnerabilities or security hotspots in the codebase
            - Snyk dependency scan identifying medium or high severity vulnerabilities in third-party libraries
            - Docker image scan detecting HIGH or MEDIUM severity vulnerabilities using Trivy
            - Build or runtime dependency installation issues affecting application startup

            🔗 Full Execution Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            📌 Required Action:
            Please review the pipeline logs thoroughly, identify the exact failure point, and take corrective measures to resolve the issue before the next deployment cycle to maintain application security and stability.

            Regards,
            DevSecOps Pipeline
          to: ${{ secrets.DEVOPS_EMAIL }}
          from: DevOps Alert

      # ✅ Success Email (Detailed)
      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Bookingservice Pipeline Success - Ready for Deployment"
          body: |
            Hello DevOps Team,

            The Bookingservice CI/CD pipeline has completed successfully, and all quality, security, and compliance checks have been validated without any issues.

            ✅ Execution Summary:
            - Repository: ${{ github.repository }}
            - Branch: ${{ github.ref_name }}
            - Workflow: ${{ github.workflow }}
            - Job: ${{ github.job }}
            - Triggered By: ${{ github.actor }}

            🔐 Validation Results:
            - SonarQube Quality Gate passed successfully with no blocking vulnerabilities
            - Snyk dependency scan confirmed no medium or high severity issues
            - Docker image security scan passed with no critical findings
            - Application build and containerization completed successfully

            🚀 Deployment Status:
            The Docker image has been securely built, scanned, and pushed to the container registry, and is now fully ready for deployment into the Kubernetes environment.

            🔗 Full Execution Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            No further action is required at this stage.

            Regards,
            DevSecOps Pipeline
          to: ${{ secrets.DEVOPS_EMAIL }}
          from: DevOps Alert
```
